<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Jeanie Yu</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="gallery.css">
    <link rel="icon" href="projects/star.png" type="image/x-icon"/>
</head>

<body class="home gallery-page">
    <div class="cursor-white"></div>

    <!-- Loading screen: types "welcome to my world ⋆｡°.✩" while the first images load -->
    <div class="gallery-loader" aria-live="polite">
        <p class="gallery-loader-text"><span class="typed"></span><span class="caret"></span></p>
    </div>

    <!-- Logo + "< home", floating over the canvas (top left) -->
    <div class="gallery-logo">
        <h1 class="logo-heading"><a href="index.html" onmouseenter="changeCursorColor()" onmouseleave="revertCursorColor()"><img src="jeanielogo.svg" alt="Jeanie Yu" class="site-logo"></a></h1>
        <p class="intro gallery-back-line"><a href="index.html" class="gallery-back" onmouseenter="changeCursorColor()" onmouseleave="revertCursorColor()">&lt; home</a></p>
    </div>


    <!-- Phones: the same pinned logo + menu + line as the homepage and project pages -->
    <div class="gallery-mobile-head">
        <div class="title-space">
            <h1 class="logo-heading"><a href="index.html"><img src="jeanielogo.svg" alt="Jeanie Yu" class="site-logo"></a></h1>
            <nav class="site-nav">
                <a href="about.html" class="nav-link">About Me</a>
                <a href="index.html" class="nav-link">Projects</a>
                <a href="gallery.html" class="nav-link active">Gallery</a>
            </nav>
        </div>
    </div>

    <!-- Endless canvas: drag, scroll or use the arrow keys -->
    <main id="gallery" aria-label="Gallery of all project images">
        <div id="gallery-world"></div>
    </main>

    <script src="script.js"></script>
    <script src="gallery-data.js"></script>
    <script src="gallery.js"></script>
    <script src="gallery-loader.js"></script>
    <script src="gallery-cursor.js"></script>
</body>

</html>
